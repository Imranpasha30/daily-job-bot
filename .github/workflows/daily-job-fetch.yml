name: Daily Job Sweep & Live Web Portal Update

on:
  schedule:
    # 03:30 UTC = 09:00 AM Indian Standard Time (IST) every single day
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write
  pages: write

jobs:
  sweep-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Full Job Refresh & Build Portal
        run: |
          npm run refresh

      - name: Commit and Push Updated Portal
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.html cyber_jobs.html final.json cyber_final.json index.html resumes/
          git commit -m "Auto-refresh jobs and update live website [skip ci]" || echo "No changes to commit"
          git push
